server {
    listen 80 default_server;
    server_tokens off;
    server_name _;
    return 301 https://www.bakey.us$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    server_name www.bakey.us;

    ssl_certificate /etc/letsencrypt/live/bakey.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bakey.us/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/bakey.us/fullchain.pem;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
    resolver_timeout 5s;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # A location that sets add_header drops these, so the static location
    # includes the same file again.
    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(ico|pdf|jpg|jpeg|png|gif|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform" always;
        include /etc/nginx/security-headers.conf;
    }
}
