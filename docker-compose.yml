version: '3'
services:
  web:
    build: .
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - type: bind
        source: ./html
        target: /usr/share/nginx/html
        consistency: cached
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        consistency: cached
    container_name: bakey-website-local
    restart: unless-stopped
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - DEVELOPMENT=true
      - CHOKIDAR_USEPOLLING=true
