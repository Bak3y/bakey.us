server {
    listen 80;
    server_tokens off;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript image/svg+xml;

    # add_header in this location replaces the server headers above.
    location ~* \.(ico|pdf|jpg|jpeg|png|gif|css|js)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
